<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ma7ali</title>
  <link rel="stylesheet" href="css/index.css" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="shortcut icon" href="/icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Ma7ali" />
</head>

<body>
  <nav>
    <button class="menu-btn" aria-label="Toggle Sidebar">
      <img src="icons/bars-solid (1).svg" alt="" width="24" height="24" />
    </button>
    <div class="search-container-main">
      <input type="text" class="search-bar" id="search-products-bar" autocomplete="mobile"
        placeholder="Search Product" />
      <img src="icons/magnifying-glass-solid.svg" width="24" height="24" alt="Search" class="search-icon" />
      <div class="top-bar">
        <button id="toggleCurrencyBtn" class="currency-toggle-btn"></button>
      </div>
    </div>
    <div class="theme-switch-wrapper">
      <label class="theme-switch">
        <input type="checkbox" id="toggle-theme-btn" />
        <span class="sliderr round">
        </span>
      </label>
    </div>
  </nav>


  <aside id="sidebar">
    <button type="button" id="close-btn">
      <img src="icons/xmark-solid.svg" width="24" height="24" alt="Close" />
    </button>

    <div class="side-links-container">
      <a href="#" class="sidebar-link" data-section="profile" id="profile">Store</a>
      <a href="#" class="sidebar-link" id="tasksLink">Tasks & Reminders</a>
      <a href="#" class="sidebar-link" data-section="pdflayout" id="pdf-layout">PDF Layout</a>
      <a href="#" class="sidebar-link" id="feedback-btn">Feedback</a>
      <a href="#" class="sidebar-link" data-section="help" id="help">Help Center</a>
      <a href="#" class="sidebar-link" id="refresh">Refresh</a>
      <a href="#" class="sidebar-link logout-btn" id="logout-btn">Logout</a>
    </div>
  </aside>

  <div class="tasks" id="tasks">
    <div class="header-container">
      <h5 style="font-weight: bolder">Tasks & Reminders</h5>
      <button type="button" id="done-btn">Done</button>
    </div>

    <!-- Add/Edit Task Modal -->
    <div id="task-modal" class="task-modal">
      <div class="task-modal-content">
        <h2 id="modal-title">Add New Task</h2>
        <input type="text" id="task-title" placeholder="Task title">
        <textarea id="task-content" placeholder="Task details (optional)"></textarea>

        <label for="task-due-date">Due Date & Time (optional):</label>
        <input type="datetime-local" id="task-due-date">

        <button type="button" class="action-btn" id="add-task-btn">Add Task</button>
      </div>
    </div>

    <h2>Your Tasks</h2>
    <div class="tasks-list" id="tasks-list"></div>
  </div>

  <div class="notification" id="notification">
  </div>

  <div id="overlay"></div>

  <div class="edit-customer-form" id="edit-customer-form"></div>

  <main>
    <div class="main-content" id="main-content">
    </div>
  </main>
  
  <footer>
    <div class="bottom-nav">
      <button class="nav-btn" data-section="dashboard">
        <img src="icons/house-solid.svg" alt="Home" width="24" height="24" />
      </button>

      <button class="nav-btn" data-section="cartAndSales">
        <img src="icons/cart-shopping-solid.svg" alt="Cart" width="24" height="24" />
      </button>

      <!--Pop Button-->
      <button class="pop" id="pop">
        <img src="icons/circle-plus-solid.svg" id="pop-img" alt="Cart" width="35" height="35" />
      </button>
      <div class="slider" id="slider">
        <button class="add-sales-btn" id="add-sales-btn" data-section="addSales">
          <img src="icons/square-plus-solid.svg" />
        </button>
        <button class="add-cart-btn" id="add-cart-btn" data-section="addCart">
          <img src="icons/cart-plus-solid.svg" />
        </button>
        <button class="add-customer-btn" id="add-customer-btn" data-section="addCustomer">
          <img src="icons/user-plus-solid.svg" />
        </button>
        <button class="add-product-btn" id="add-product-btn" data-section="addProduct">
          <img src="icons/boxes-packing-solid.svg" />
        </button>
      </div>
      <!------------>

      <button class="nav-btn" data-section="customers">
        <img src="icons/users-solid.svg" alt="Customers" width="24" height="24" />
      </button>

      <button class="nav-btn" data-section="products">
        <img src="icons/box-open-solid.svg" alt="Products" width="24" height="24" />
      </button>

      <span class="active-indicator" id="active-indicator"></span>
    </div>
  </footer>

  <div id="feedback-modal" class="feedback-modal">
    <div class="feedback-modal-content">
      <span class="close-feedback-modal">❌</span>
      <h2>Feedback</h2>
      <p>We appreciate your feedback! Let us know how we can improve.</p>
      <textarea id="feedback-text" placeholder="Type your feedback here..."></textarea>
      <button id="submit-feedback">Submit</button>
      <p id="feedback-message" class="feedback-message"></p>
    </div>
  </div>

  <div id="loading-overlay">
    <div class="progress-container">
      <div class="progress-text">Loading...</div>
      <div id="progress-bar"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-3-typeahead/4.0.2/bootstrap3-typeahead.min.js"></script>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-tagsinput/0.8.0/bootstrap-tagsinput.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-tagsinput/0.8.0/bootstrap-tagsinput.min.js"></script>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-messaging-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

  <script type="module" src="js/index.js"></script>
</body>

</html>
