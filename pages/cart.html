<h1>Carts</h1>
<p>View and manage your cart items here.</p>

<!-- Search Customer -->
<div class="search-container">
    <input type="text" class="search-bar" placeholder="Search Cart">
    <img src="icons/magnifying-glass-solid.svg" alt="Search" class="search-icon">
</div>

<!-- Transactions List -->
<h2 class="transactions-title">TRANSACTIONS LIST</h2>
<div class="transactions-list">
    <div class="cart-item yellow">1</div>
    <div class="cart-item red">2</div>
    <div class="cart-item yellow">4</div>
    <div class="cart-item red">5</div>
    <div class="cart-item yellow">6</div>
</div>

<!-- Customer Actions -->
<div class="actions">
    <button class="func-btn">START A NEW CART</button>
    <button class="func-btn">START SALES</button>
</div>
